<text x="750.0" y="532" font-size="12.8" fill="#444" text-anchor="middle" font-weight="normal">Take-home: transfer learning (VGG16) gives the best balanced accuracy; the from-scratch CNN ranks well (AUC 0.914) but collapses at the 0.5 threshold, a calibration issue. Grad-CAM and SHAP confirm lung-field attention.</text>
